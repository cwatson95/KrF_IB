[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "f2-sweep-krf"
version = "0.1.0"
description = "One-dimensional charged-fluid excimer-laser model and F2 sweep tools"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

[tool.setuptools.packages.find]
where = ["src"]
