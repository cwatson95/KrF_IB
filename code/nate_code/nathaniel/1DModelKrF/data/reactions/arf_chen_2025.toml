# REPRODUCTION ONLY — printed Chen et al. (2025) Table III values.
#
# This overlay deliberately restores the paper's printed values/products where arf.toml applies
# a cited physical correction, and disables post-publication/cited additions absent from Table III.
# It is not the production chemistry model.  The loader expands this overlay against arf.toml so
# shared rows, identifiers, units, and cross-section bindings cannot silently drift.

base_network = "arf.toml"
reproduction_only = true
disable_reactions = ["R21b", "R29c"]

