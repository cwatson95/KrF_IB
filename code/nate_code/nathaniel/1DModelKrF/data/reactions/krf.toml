# Reduced Ne/Kr/F2 KrF* laser reaction network (45 active reactions)
#
# This is the KrF* counterpart of data/reactions/arf.toml.  It is a deliberately reduced,
# closed network for a three-gas Ne/Kr/F2 discharge, assembled from the primary-rate audit in
# rate-references/ne_kr_f_rates.csv and rate-references/kannari1985_KrF_rates_final.csv.
# Electron-impact rows use the project's cited LXCat/SIGLO/Morgan cross-section datasets.
#
# STATE CONTRACT
#   KrF*  = the optically active, B-dominated 248 nm population.  Its measured B-state lifetime
#           (9 ns) is paired with the B-state stimulated-emission cross section (2.6e-16 cm2).
#           C/D states and B<->C mixing are not separately resolved in this reduced model.
#   Kr*, Ne* = lumped metastable manifolds; Kr**, Ne** = lumped higher manifolds.
#   Kr2*, Ne2*, Kr2F* are explicit molecular excited-state sinks/intermediates.
#
# UNITS
#   Published cgs rate constants are retained with k_units="cm3/s" or "cm6/s" and converted
#   to SI by the loader.  Bare photo cross sections use sigma_m2.  Electron temperature Te in
#   te_dependent rows is in eV: k = K0 * Te^te_power * exp(-E0_eV/Te).
#
# DOCUMENTED REDUCTIONS / CORRECTIONS
#   * e + F2 -> F2+ + 2e conserves charge (the abbreviated '+ e' product is incorrect).
#   * Kr2+ + F- forms KrF* + Kr, not KrF* + F.  The latter violates both Kr and F balance.
#   * R30/R31 are effective atmospheric-pressure two-body mutual-neutralization coefficients;
#     the stabilizing bath gas is implicit, so pressure-scan fidelity is limited.
#   * KrF* + F2 is the measured electronic-quench channel Kr + F + F2.  The often-copied
#     Kr + 3F products are the ArF table's dissociative branch and are not used for KrF here.
#   * R18 sends the measured total Ne*+F2 quench into the neutral-dissociation branch.  Branching
#     among neutral dissociation, Penning ionization, and ion-pair formation is not measured, so
#     those alternatives are not added (which would double-count the measured total).
#   * R24 is retained because it was requested, but 1e-14 cm3/s is an experimental upper bound;
#     Ne+ -> Kr+ atomic charge transfer is negligible in this mixture.
#   * PHOTO rows use exact frozen-fluence hazards to attenuate the 248 nm field, consume the
#     absorber, create declared products, and deposit sourced photoelectron birth energy.

