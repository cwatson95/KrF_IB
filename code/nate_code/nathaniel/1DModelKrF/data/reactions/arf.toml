[[reaction]]
id = "R40"
reactants = "Ar** + hv193"
products = "Ar+ + e"
rate_form = "photo"
sigma_m2 = 1.0e-22                # photoionization cross section (m^2, Chen R40)
# Photoelectron KE = hv(193.0 nm) - binding = 6.424 - (IP 15.7596 - E(4p) ~13.1) ~ 3.76 eV.
# Ar 3p5 4p manifold 12.90-13.48 eV and IP from NIST ASD (Kramida et al.); mean-4p reading.
electron_energy_eV = 3.76
photon_mode = "hv193"
reference = "H. Akashi, Y. Sakai, and I. Tagashira, Modelling of a self-sustained discharge-excited ArF excimer laser: The influence of photo-ionization and photodetachment by laser light on the discharge development, J. Phys. D: Appl. Phys. 28, 445 (1995). [Chen et al., Phys. Plasmas 32, 113502 (2025), Table III, ref 30]"
# Chen Table III R40: 1e-22 m^2 (photoionization of Ar**)

[[reaction]]
id = "R41"
reactants = "F- + hv193"
products = "F + e"
rate_form = "photo"
sigma_m2 = 1.0e-21                # photodetachment cross section (m^2, Chen R41)
# Photoelectron KE = hv(193.0 nm) - EA(F) = 6.424 - 3.4012 = 3.02 eV.
# EA(F) 3.4012 eV: C. Blondel, P. Cacciani, C. Delsart, R. Trainham, Phys. Rev. A 40, 3698 (1989).
electron_energy_eV = 3.02
photon_mode = "hv193"
reference = "H. Akashi, Y. Sakai, and I. Tagashira, Modelling of a self-sustained discharge-excited ArF excimer laser: The influence of photo-ionization and photodetachment by laser light on the discharge development, J. Phys. D: Appl. Phys. 28, 445 (1995). [Chen et al., Phys. Plasmas 32, 113502 (2025), Table III, ref 30]"
# Chen Table III R41: 1e-21 m^2 (photodetachment of F-)
