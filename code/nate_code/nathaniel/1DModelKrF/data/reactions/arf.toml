# ==================================================================================================
# F. UV radiation
# ==================================================================================================
# DOCUMENTED CORRECTION (verified against Ma 2024, Chen's cited source for this row): Chen
# prints 3.5e-45 m6/s; Ma Table 2 #42 gives 3.5e-43 m6/s — the literature ArF*+Ar+M -> Ar2F*
# trimer-formation rate (~4e-31 cm6/s). Exponent typo in Chen; at 3.4 atm this channel is a
# real ~8e7 s^-1 ArF* sink (25% of spontaneous emission), not negligible.

[[reaction]]
id = "R37"
reactants = "ArF*"
products = "Ar + F + hv193"
rate_form = "radiative"
tau_s = 4.19992e-9                # = 1 / 2.381e8 s^-1 (spontaneous emission)
photon_mode = "hv193"
reference = "H. Akashi, Y. Sakai, and I. Tagashira, Modelling of a self-sustained discharge-excited ArF excimer laser: The influence of photo-ionization and photodetachment by laser light on the discharge development, J. Phys. D: Appl. Phys. 28, 445 (1995). [Chen et al., Phys. Plasmas 32, 113502 (2025), Table III, ref 30]"
# Chen Table III R37: A = 2.381e8 s^-1 (spontaneous emission)

[[reaction]]
id = "R38"
reactants = "ArF* + hv193"
products = "Ar + F + 2 hv193"
rate_form = "stimulated"
sigma_eff_cm2 = 4.0e-16           # stimulated-emission cross section = 4e-20 m^2 (Chen R38)
photon_mode = "hv193"
reference = "H. Akashi, Y. Sakai, and I. Tagashira, Modelling of a self-sustained discharge-excited ArF excimer laser: The influence of photo-ionization and photodetachment by laser light on the discharge development, J. Phys. D: Appl. Phys. 28, 445 (1995). [Chen et al., Phys. Plasmas 32, 113502 (2025), Table III, ref 30]"
# Chen Table III R38: 4e-20 m^2 (stimulated emission)

[[reaction]]
id = "R39"
reactants = "Ar**"
products = "Ar* + hv95"
rate_form = "radiative"
tau_s = 1.0e-9                    # Chen's printed A = 1e9 s^-1, kept; routing corrected (see note)
photon_mode = "hv95"
# DOCUMENTED DEVIATION (typo-class of R26): printed products "Ar + hv95" put the 95 nm
# resonance photon on the 4p->ground transition, which is E1-parity-forbidden (3p5 4p is
# even like the 3p6 ground state); 95 nm belongs to Ar*(4s 1P1)->ground, and the fast 4p
# decay is the 4p->4s cascade (~810 nm) INTO Ar*. Products read as the physical cascade;
# the photon booking (energy exit) is unchanged. Akashi 1995 (Chen ref 30) models this
# cascade + 4s resonance trapping explicitly.
reference = "H. Akashi, Y. Sakai, and I. Tagashira, Modelling of a self-sustained discharge-excited ArF excimer laser: The influence of photo-ionization and photodetachment by laser light on the discharge development, J. Phys. D: Appl. Phys. 28, 445 (1995). [Chen et al., Phys. Plasmas 32, 113502 (2025), Table III, ref 30]"
# Chen Table III R39: Ar** -> Ar + hv95, A = 1e9 s^-1 (printed reactant is Ar**, not Ar2F*)

